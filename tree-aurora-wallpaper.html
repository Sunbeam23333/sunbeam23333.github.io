<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#02030a" />
    <meta name="description" content="An animated aurora study shaped by the Cassel tree emblem." />
    <title>Cassel Tree Aurora Wallpaper</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="tree-aurora-wallpaper.css?v=20260809-tree-v3" />
  </head>
  <body>
    <main class="wallpaper" aria-label="Animated Cassel tree aurora study">
      <div class="wallpaper-fallback" aria-hidden="true"></div>
      <canvas
        class="wallpaper-canvas"
        data-tree-aurora
        data-tree-mode="wallpaper"
        data-tree-mask="assets/cassel-tree-flow-mask.png?v=20260809-tree-v3"
        data-tree-source-mask="assets/cassel-tree-mask.png?v=20260809-tree-v3"
        data-tree-veins="assets/cassel-tree-veins.png?v=20260809-tree-v3"
        aria-hidden="true"
      ></canvas>
    </main>
    <script src="tree-aurora.js?v=20260809-tree-v4"></script>
  </body>
</html>
